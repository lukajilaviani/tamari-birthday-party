<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamari's Birthday Party</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #e8dcc8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #e8dcc8;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: auto;
            display: inline-block;
        }

        .party-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Clickable location overlay */
        .location-clickable {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            font-weight: bold;
            color: #333;
            text-decoration: underline;
            z-index: 100;
            transition: all 0.3s ease;
            padding: 5px 10px;
        }

        .location-clickable:hover {
            color: #ff69b4;
            transform: translateX(-50%) scale(1.05);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: #fff;
            margin: 50px auto;
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
            position: relative;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #ff69b4;
        }

        .modal-title {
            font-family: 'Brush Script MT', cursive;
            font-size: 40px;
            color: #ff69b4;
            margin: 20px 0 30px 0;
            font-style: italic;
            text-align: center;
        }

        .location-details {
            color: #333;
            line-height: 2;
            margin: 20px 0;
            text-align: center;
        }

        .location-details p {
            margin: 15px 0;
            font-size: 16px;
        }

        .location-details strong {
            color: #ff69b4;
        }

        .map-container {
            margin: 25px 0;
            border-radius: 10px;
            overflow: hidden;
            height: 300px;
            border: 3px solid #ffb6d9;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            display: block;
            margin: 20px auto 0;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3);
        }

        .close-btn:hover {
            background: linear-gradient(135deg, #ff1493, #c20077);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .modal-content {
                width: 95%;
                padding: 25px;
            }

            .modal-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-wrapper">
            <img src="https://raw.githubusercontent.com/lukajilaviani/party-image.png/main/party-image.png.jpeg" alt="Tamari's Birthday Party" class="party-image">
            <!-- Clickable location text -->
            <div class="location-clickable" onclick="openLocationModal()">LOCATION</div>
        </div>
    </div>

    <!-- Location Modal Popup -->
    <div id="locationModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLocationModal()">&times;</span>
            
            <div class="modal-title">🎉 Party Location 🎉</div>
            
            <div class="location-details">
                <p><strong>📍 Venue:</strong> Mexeta</p>
                <p><strong>📅 Date:</strong> September 11</p>
                <p><strong>🕖 Time:</strong> 18:00 PM</p>
            </div>

            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.1841562252597!2d-74.00601592346899!3d40.71282907138128!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzEuMjMwNiwgLTc0LjAwNjAx!5e0!3m2!1sen!2sus!4v1234567890" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <button class="close-btn" onclick="closeLocationModal()">Close</button>
        </div>
    </div>

    <script>
        function openLocationModal() {
            document.getElementById("locationModal").style.display = "block";
        }

        function closeLocationModal() {
            document.getElementById("locationModal").style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById("locationModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
